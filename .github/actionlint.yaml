# actionlint 1.7.12 predates GitHub's self-repository syntax (`uses: $/...`, July 2026), which
# pipeline.yml and release.yml use to call sibling workflows and actions at the pinned commit.
paths:
  .github/workflows/*.yml:
    ignore:
      - 'reusable workflow call "\$/\.github/workflows/'
      - 'specifying action "\$/\.github/actions/'
# actionlint 1.7.12 also predates GitHub's `xcode-27` image (macOS with Xcode 27, preview since
# 2026-07-16), the only hosted image with Xcode 27; it is GitHub-hosted, not self-hosted.
self-hosted-runner:
  labels:
    - xcode-27
    - xcode-27-xlarge
