name: config
description: >-
  Read ci.yml's configuration: infra defaults (defaults.yml next to this file), then
  config/repos/<repository name>.yml in pyrlyn/ci at the pinned commit, then the caller's
  own config file (default .github/infra.yml). Later files win key by key; lists are replaced.
  Emits `json` (normalized config: `<check>.run` booleans, input values), `jobs` (custom job
  matrix), `skip-ok` (checks the gate may see as skipped) and `docs-only` (this change is
  documentation only and `docs-only.enabled` is on; the `changes` action decides, through the
  GitHub compare API). Usable on its own, e.g. a caller job that skips local heavy jobs too.
inputs:
  config-file:
    description: Path of the caller's config file. A missing file means infra defaults.
    required: false
    default: .github/infra.yml
  cancel-run-on-failure:
    description: '"true"/"false" overrides the config; empty keeps it.'
    required: false
    default: ""
  token:
    description: Token for the compare API calls of the docs-only check (contents read).
    required: false
    default: ${{ github.token }}
outputs:
  json:
    description: Normalized configuration (JSON).
    value: ${{ steps.config.outputs.json }}
  jobs:
    description: Custom jobs (JSON list for a matrix `include`).
    value: ${{ steps.config.outputs.jobs }}
  skip-ok:
    description: Space-separated job names that are skipped on purpose.
    value: ${{ steps.config.outputs.skip-ok }}
  draft-skip:
    description: '"true" when this is a draft PR and skip-drafts is on.'
    value: ${{ steps.config.outputs.draft-skip }}
  docs-only:
    description: >-
      "true" when docs-only is enabled for this event and every changed file is documentation.
    value: ${{ steps.config.outputs.docs-only }}
runs:
  using: composite
  steps:
    # Only the config file; no credentials left behind.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: .infra-config
        persist-credentials: false
        sparse-checkout: ${{ inputs.config-file }}
        sparse-checkout-cone-mode: false
    - id: config
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        CONFIG_FILE: ${{ inputs.config-file }}
        REPO_NAME: ${{ github.event.repository.name }}
        PRIVATE: ${{ github.event.repository.private }}
        EVENT: ${{ github.event_name }}
        DRAFT: ${{ github.event.pull_request.draft }}
        CANCEL_OVERRIDE: ${{ inputs.cancel-run-on-failure }}
        # For the `changes` action's script (docs-only), as in changes/action.yml.
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        BASE: >-
          ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha
          || github.event.before }}
        HEAD: >-
          ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha
          || github.sha }}
      run: |
        set -euo pipefail
        files=("$ACTION_PATH/defaults.yml")
        central="$ACTION_PATH/../../../config/repos/$REPO_NAME.yml"
        if [ -f "$central" ]; then files+=("$central"); echo "central: config/repos/$REPO_NAME.yml"; fi
        if [ -f ".infra-config/$CONFIG_FILE" ]; then
          files+=(".infra-config/$CONFIG_FILE"); echo "local: $CONFIG_FILE"
        else
          echo "::notice title=infra config::no $CONFIG_FILE; using infra defaults"
        fi
        # yq (mikefarah) ships on GitHub-hosted runners: deep-merge maps, replace lists.
        merged="$(yq eval-all -o=json '. as $f ireduce ({}; . * $f)' "${files[@]}")"
        # Docs-only: ask the `changes` action's script only when the config turns it on for
        # this event. It fails open (no diff, API error, CI file changed: docs_only=false).
        DOCS_ONLY=false
        if jq -e --arg e "$EVENT" '(."docs-only" // {}) as $d | ($d.enabled == true)
            and (($d.events // []) as $ev | ($ev | length) == 0 or ($ev | any(. == $e)))' \
            <<<"$merged" >/dev/null; then
          changes_out="$(mktemp)"
          DOCS_PATHS="$(jq -r '(."docs-only".paths // [])[]' <<<"$merged")" \
            NOT_DOCS_PATHS="$(jq -r '(."docs-only".exclude // [])[]' <<<"$merged")" \
            EVENT="$EVENT" GITHUB_OUTPUT="$changes_out" \
            bash "$ACTION_PATH/../changes/changes.sh"
          DOCS_ONLY="$(sed -n 's/^docs_only=//p' "$changes_out")"
          echo "docs-only: $DOCS_ONLY"
        fi
        export DOCS_ONLY
        python3 "$ACTION_PATH/normalize.py" <<<"$merged"
