# Defaults for ci.yml, merged under config/repos/<repo>.yml (central, in infra) and the
# consumer's .github/infra.yml (local, wins). Maps merge key by key; lists are replaced.
# Schema and examples: docs/config.md.
version: 1

# Cancel the whole run when any job fails (cancel-run). Needs `actions: write` on the caller.
cancel-run-on-failure: true
# Draft pull requests run nothing (the gate included).
skip-drafts: true
# SARIF upload to code scanning: auto = public repositories only (Free plan).
upload-sarif: auto

# Docs-only changes (docs/config.md, "Docs-only changes"): with `enabled`, a change whose every
# file is documentation (`*.md` or a `paths` match, no `exclude` match; the `changes` action)
# skips each check and custom job whose own `docs-only` is false. The gate counts them as
# passed, so a required `gate` still reports. Off by default.
docs-only:
  enabled: false
  events: [pull_request, merge_group]  # push to main keeps every check
  paths: []    # extended regexes of more documentation files, e.g. '^docs/.*\.(png|svg)$'
  exclude: []  # extended regexes of Markdown that is code (include_str!, tests, releases)

# `enabled`: true | false | auto (auto = public repositories only; pyrlyn policy: no scans on
# private repositories). `events`: run only for these github.event_name values (empty = all).
rust:
  enabled: false
  events: []
  docs-only: false  # true: also runs on a docs-only change
  matrix: []            # [] = ci-rust.yml's shared four-target matrix
  rust-version: ""
  fmt-runs-on: ubuntu-latest
  working-directory: "."
  mise-install-args: rust
  clippy-args: ""
  tools: ""
  setup-command: ""
  test-command: cargo test $PACKAGE_ARGS --all-targets $FEATURE_ARGS
  doc-tests: true
  build-command: cargo build $PACKAGE_ARGS --all-targets $FEATURE_ARGS --target "$TARGET"
  package-args: --workspace
  feature-args: --all-features
  msrv: ""
  msrv-command: cargo check $PACKAGE_ARGS --all-targets $FEATURE_ARGS
  timeout-minutes: 60
  cache-all-refs: false
  # true: no work (the checks still pass) when no Rust file changed. A Cargo.toml/Cargo.lock
  # change always runs everything, with `full-package-args` instead of `package-args`.
  changed-only: false
  full-package-args: --workspace

# .NET tests (ci-dotnet.yml): a no-op job until the repository has a *.csproj/*.fsproj/
# *.vbproj or *.sln/*.slnx, then `dotnet test` for every solution. A .NET dependency change
# (project files, Directory.Packages.props, packages.lock.json, global.json, NuGet.config)
# always runs the full suite.
dotnet:
  enabled: true
  events: []
  docs-only: false
  dotnet-version: ""     # "" = global.json, else the runner's SDK
  working-directory: "."
  test-command: ""       # "" = dotnet test for every solution (or project)
  changed-only: false
  runs-on: ubuntu-latest
  timeout-minutes: 60

codeql:
  enabled: auto
  events: []
  docs-only: false
  languages: [actions]
  build-mode: none
  build-command: ""
  queries: security-and-quality
  config-file: ""
  runs-on: ubuntu-latest

semgrep:
  enabled: auto
  events: []
  docs-only: false
  config: p/default
  extra-args: ""
  fail-on-findings: false

# Snyk is off org-wide (switch, not removal): `enabled: true` or `auto` in a repository's
# .github/infra.yml (or config/repos/<repo>.yml) turns it back on. A disabled check is
# skipped and the gate treats it as passed.
snyk:
  enabled: false
  events: []
  docs-only: false
  args: --all-projects
  monitor: true

sonarcloud:
  enabled: false
  events: []
  docs-only: false
  organization: ""
  project-key: ""
  args: ""
  project-base-dir: "."
  mise: true
  mise-install-args: ""
  rust: false
  setup-command: ""
  coverage-command: ""
  soft-fail: true
  timeout-minutes: 60

lint:
  enabled: true
  events: []
  docs-only: true  # true: also runs on a docs-only change
  actionlint-version: 1.7.12
  args: ""
  extra-command: ""

# Repository-specific jobs, run as one matrix job (`ci / <name>`). See docs/config.md.
jobs: []
