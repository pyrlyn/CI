name: sync-docs

# Publishes the caller's docs/ to the site repository (pyrlyn/landing), the same job (parametrized) that
# rtok, ketch and cox each carried as sync-docs.yml:
#   - <docs-dir>/site.md (the project card) -> content/projects/<repo name>.md; on a v* tag or
#     release its `version:` front matter is set from the tag (v1.2.3 -> "1.2.3").
#   - every other user-facing <docs-dir>/**/*.md -> content/docs/<repo name>/ (mirrored,
#     deletions too), plus _source.json (repo, commit, ref). Internal pages (research, QA audits,
#     design notes, ADRs, proposals, plans, to-do/done/roadmap notes, agent instructions,
#     maintainer runbooks, asset notes) are left out by a shared rsync filter plus the caller's
#     `extra-excludes`; --delete-excluded removes any copy already on the site.
#   - with `locales` (e.g. "ru uk"): <docs-dir>/<lang>/site.md -> content/projects/<lang>/<name>.md
#     (removed there when the source is gone), and <docs-dir>/<lang>/**/*.md ->
#     content/docs/<repo name>/<lang>/, each mirrored on its own (same filter); the English
#     mirror leaves the locale folders alone.
# Auth: a write-enabled deploy key on the site repository only, passed as SITE_DEPLOY_KEY;
# GITHUB_TOKEN stays read-only. The caller owns the triggers and the `concurrency` group
# (`sync-docs`, never cancelled) because a callee group would be keyed on the caller anyway.
#
# Caller job permissions: contents: read.
on:
  workflow_call:
    inputs:
      docs-dir:
        description: Directory with site.md and the pages to mirror.
        type: string
        required: false
        default: docs
      site-repository:
        description: Site repository that receives the content.
        type: string
        required: false
        default: pyrlyn/landing
      site-branch:
        description: Branch of the site repository to push to.
        type: string
        required: false
        default: main
      locales:
        description: >-
          Space-separated locale folders under docs-dir (e.g. "ru uk") published next to the
          English pages: their site.md as a localized project card, their pages under
          content/docs/<repo name>/<lang>/. Empty publishes English only.
        type: string
        required: false
        default: ""
      extra-excludes:
        description: >-
          This repository's own internal pages to leave out, one rsync exclude pattern per line
          (e.g. compat.md), on top of the shared list.
        type: string
        required: false
        default: ""
    secrets:
      SITE_DEPLOY_KEY:
        description: Private half of a write-enabled deploy key on the site repository.
        required: true

permissions:
  contents: read

jobs:
  sync:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.site-repository }}
          ref: ${{ inputs.site-branch }}
          ssh-key: ${{ secrets.SITE_DEPLOY_KEY }}
          path: site
      - name: Copy docs/site.md into the site repository
        env:
          PROJECT: ${{ github.event.repository.name }}
          DOCS_DIR: ${{ inputs.docs-dir }}
          SITE_REPOSITORY: ${{ inputs.site-repository }}
          SITE_BRANCH: ${{ inputs.site-branch }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          LOCALES: ${{ inputs.locales }}
        run: |
          set -euo pipefail
          # "" is English: <docs-dir>/site.md -> content/projects/<name>.md (required). A
          # localized card is optional: <docs-dir>/<lang>/site.md -> content/projects/<lang>/.
          # LOCALES is a word list.
          # shellcheck disable=SC2086
          for lang in "" $LOCALES; do
            src="source/$DOCS_DIR/${lang:+$lang/}site.md"
            dest="site/content/projects/${lang:+$lang/}${PROJECT}.md"
            if [ ! -f "$src" ]; then
              if [ -z "$lang" ]; then echo "::error::$DOCS_DIR/site.md is missing"; exit 1; fi
              rm -f "$dest"
              continue
            fi
            mkdir -p "$(dirname "$dest")"
            cp "$src" "$dest"
            if [ "$REF_TYPE" = "tag" ]; then
              VERSION="${REF_NAME#v}" DEST="$dest" python3 - <<'PY'
          import os, re
          path, version = os.environ["DEST"], os.environ["VERSION"]
          text = open(path, encoding="utf-8").read()
          m = re.match(r"---\n(.*?\n)---\n", text, re.S)
          if m:
              fm = m.group(1)
              line = f'version: "{version}"\n'
              if re.search(r"^version:.*\n", fm, re.M):
                  fm = re.sub(r"^version:.*\n", line, fm, count=1, flags=re.M)
              else:
                  fm += line
              text = f"---\n{fm}---\n" + text[m.end():]
              open(path, "w", encoding="utf-8").write(text)
          PY
            fi
          done
      - name: Mirror the other user-facing docs/**/*.md into the site repository
        env:
          PROJECT: ${{ github.event.repository.name }}
          DOCS_DIR: ${{ inputs.docs-dir }}
          SITE_REPOSITORY: ${{ inputs.site-repository }}
          SITE_BRANCH: ${{ inputs.site-branch }}
          EXTRA_EXCLUDES: ${{ inputs.extra-excludes }}
          LOCALES: ${{ inputs.locales }}
          SOURCE: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          dest="site/content/docs/${PROJECT}"
          mkdir -p "$dest"
          # Only user-facing docs are published. Internal pages stay in the source repository and
          # are left out here: research, QA audits, design notes and ADRs, proposals, plans and
          # to-do, done and roadmap notes, agent instructions, maintainer runbooks and asset notes,
          # plus the caller's extra-excludes. The patterns carry no leading / so they match at any
          # depth; --delete-excluded removes any copy already on the site.
          internal=(
            --exclude='research/' --exclude='research*.md'
            --exclude='qa/' --exclude='*audit*.md'
            --exclude='design/' --exclude='brand/' --exclude='assets/' --exclude='adr/' --exclude='notes/'
            --exclude='proposals/' --exclude='*proposal*.md'
            --exclude='plan*.md' --exclude='PLAN*.md' --exclude='todo*.md' --exclude='TODO*.md'
            --exclude='next*.md' --exclude='done*.md' --exclude='roadmap*.md' --exclude='ideas.md'
            --exclude='AGENTS.md' --exclude='CLAUDE.md' --exclude='agency.md'
            --exclude='sonarcloud-setup.md' --exclude='release.md' --exclude='release-*.md'
          )
          while read -r pattern; do
            if [ -n "$pattern" ]; then internal+=("--exclude=$pattern"); fi
          done <<< "$EXTRA_EXCLUDES"
          # The locale folders are not part of the English mirror: excluded on the sending side
          # and protected (P) on the receiving side, so --delete never touches them; each locale
          # is mirrored by its own rsync below.
          locale_filter=()
          for lang in $LOCALES; do
            locale_filter+=("--filter=P /$lang/" "--exclude=/$lang/")
          done
          rsync -a --delete --delete-excluded --prune-empty-dirs \
            ${locale_filter[@]+"${locale_filter[@]}"} \
            --exclude='/site.md' \
            "${internal[@]}" \
            --include='*/' --include='*.md' --exclude='*' \
            "source/$DOCS_DIR/" "$dest/"
          # Translations: <docs-dir>/<lang>/**/*.md -> content/docs/<name>/<lang>/, with English
          # file names; <docs-dir>/<lang>/site.md is a card (previous step), never a page.
          for lang in $LOCALES; do
            if [ -d "source/$DOCS_DIR/$lang" ]; then
              mkdir -p "$dest/$lang"
              rsync -a --delete --delete-excluded --prune-empty-dirs \
                --exclude='/site.md' \
                "${internal[@]}" \
                --include='*/' --include='*.md' --exclude='*' \
                "source/$DOCS_DIR/$lang/" "$dest/$lang/"
            else
              rm -rf "${dest:?}/$lang"
            fi
          done
          printf '{\n  "repo": "%s",\n  "sha": "%s",\n  "ref": "%s"\n}\n' \
            "$SOURCE" "$SOURCE_SHA" "$REF_NAME" > "$dest/_source.json"
      - name: Commit and push if changed
        working-directory: site
        env:
          PROJECT: ${{ github.event.repository.name }}
          DOCS_DIR: ${{ inputs.docs-dir }}
          SITE_REPOSITORY: ${{ inputs.site-repository }}
          SITE_BRANCH: ${{ inputs.site-branch }}
          SOURCE: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The checkout is fresh, so content/projects/ holds only this run's card changes; -A also
          # stages a localized card the copy step removed.
          git add -A -- content/projects "content/docs/${PROJECT}"
          # _source.json alone changes on every run; only commit when content changed.
          if git diff --cached --quiet -- . ":(exclude)content/docs/${PROJECT}/_source.json"; then
            echo "content/projects/${PROJECT}.md and content/docs/${PROJECT}/ are already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "content: sync ${PROJECT} from ${SOURCE}@${SOURCE_SHA:0:7} (${REF_NAME})"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:$SITE_BRANCH"; then
              echo "pushed $(git rev-parse HEAD) to $SITE_REPOSITORY $SITE_BRANCH"
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); rebasing onto the latest $SITE_BRANCH"
            sleep $((attempt * 3))
            git fetch origin "$SITE_BRANCH"
            git rebase "origin/$SITE_BRANCH"
          done
          echo "::error::could not push to $SITE_REPOSITORY $SITE_BRANCH after 5 attempts"
          exit 1
