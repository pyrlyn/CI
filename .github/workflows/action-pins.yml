name: action-pins

# Fails when any workflow or composite action uses an external action or reusable workflow
# by a tag or branch instead of a full 40-character commit SHA. Local references
# (`./...`, `$/...`) and `docker://` images pass.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# Only the newest run per workflow and ref executes: a new push cancels the older queued or
# in-progress run of this workflow on the same branch or PR. Not callable (no workflow_call),
# so github.workflow is this file's own name.
# A push to the default branch (a merge into main) never cancels or is superseded: it gets a
# group of its own run.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
    github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    && github.run_id || github.ref }}
  cancel-in-progress: >-
    ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

jobs:
  action-pins:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: action-pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that external actions are pinned by SHA
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r line; do
            file=${line%%:*}
            rest=${line#*:}
            lineno=${rest%%:*}
            ref=$(sed -E "s/^[^:]*uses:[[:space:]]*//; s/[[:space:]]*#.*\$//; s/^[\"']//; s/[\"']\$//" <<<"${rest#*:}")
            case "$ref" in
              ./* | '$/'* | docker://*) continue ;;
            esac
            if [[ ! "$ref" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_./-]+@[0-9a-f]{40}$ ]]; then
              echo "::error file=${file},line=${lineno}::'${ref}' is not pinned to a full commit SHA"
              bad=1
            fi
          done < <(grep -rnE '^[[:space:]]*-?[[:space:]]*uses:' .github/workflows .github/actions \
            --include='*.yml' --include='*.yaml' || true)
          if [[ "$bad" -ne 0 ]]; then
            echo "Pin every external action to a full commit SHA, e.g. owner/repo@<sha> # vX.Y.Z"
            exit 1
          fi
          echo "All external actions are pinned by SHA."
