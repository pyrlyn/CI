name: ci-rust

# Reusable Rust CI for pyrlyn repositories.
#
# - `fmt`: cargo fmt --check, once.
# - `rust`: one job per entry of the shared target matrix (`SHARED_MATRIX` below, or the
#   `matrix` input): clippy and check (`package-args` = --workspace by default, --all-targets,
#   `feature-args`), then the tests and doctests where the runner can run the target natively,
#   or a build of every target where it cannot (cross targets).
# - `msrv`: `msrv-command` with the `msrv` toolchain, when `msrv` is set.
#
# The Rust toolchain comes from the caller's mise.toml (pyrlyn convention: mise.toml is
# the single source of the Rust version). Pass `rust-version` to install an exact
# toolchain through rustup instead. Either way the pinned version is exported as
# RUSTUP_TOOLCHAIN and every job fails if `rustc --version` is anything else.
#
# macOS jobs select the pinned Xcode (`xcode-version`, default 27) through the setup-xcode
# action and fail when the runner has none; the shared matrix runs them on `xcode-27`, the
# GitHub image that ships Xcode 27 (macos-latest / macos-26 carry Xcode 26.x).
#
# `nextest-archive` (off) builds `cargo nextest archive` once per entry and runs the tests from
# it; `sccache` (off) wires sccache to a Cloudflare R2 bucket and is a no-op without the R2
# secrets. Both are opt-in; see docs/index.md.
#
# A failed job cancels the whole run (`cancel-run-on-failure`, on by default).
#
# `plan` classifies the changed files (the `changes` action). A change to any Cargo.toml or
# Cargo.lock forces the full suite: `full-package-args` replaces `package-args`, and
# `changed-only` cannot skip anything. With `changed-only` (off by default) a pull request
# or push without Rust changes turns the work into no-ops; the jobs still report success
# under their usual names, so required checks never wait on a skipped matrix. `skip` does the
# same unconditionally, e.g. for a docs-only pull request (the config action's `docs-only`).
# Without work, every matrix entry runs on `skip-runs-on` (ubuntu-latest) instead of its own
# runner, so a docs-only change never starts a macOS (Xcode), Windows or ARM runner; the
# check names (`matrix.target`) stay the same. The matrix job itself is never skipped at job
# level: that reports one check under the raw expression name and a required target waits.
# Caller job permissions: contents: read, actions: write.
on:
  workflow_call:
    inputs:
      skip-drafts:
        description: >-
          Skip every job on a draft pull request: a job-level `if`, so no runner starts. The
          caller's `pull_request` trigger must list `ready_for_review` in `types` so the run
          starts when the draft is marked ready. false runs drafts like any other pull request
          (ci.yml passes its `skip-drafts` config key).
        type: boolean
        required: false
        default: true
      cancel-run-on-failure:
        description: >-
          When a job fails, cancel the whole workflow run (every other running or queued
          job, the caller's included). The calling job must grant `actions: write`.
        type: boolean
        required: false
        default: true
      matrix:
        description: >-
          JSON array of matrix entries, each {"os": <runner label>, "target": <Rust target
          triple>}, optionally with "test": false to build instead of test. Empty (default)
          uses the shared pyrlyn matrix (SHARED_MATRIX below); pass a subset only when a
          target is not supported.
        type: string
        required: false
        default: ""
      rust-version:
        description: >-
          Exact Rust toolchain (e.g. "1.98.1"). Empty (default) installs Rust from the
          caller's mise.toml via jdx/mise-action.
        type: string
        required: false
        default: ""
      xcode-version:
        description: >-
          Xcode that macOS jobs select (.github/actions/setup-xcode): a major ("27") or
          major.minor ("27.1"); the job fails when the runner has none. Empty keeps the
          runner image's default Xcode.
        type: string
        required: false
        default: "27"
      fmt-runs-on:
        description: Runner label for the fmt job.
        type: string
        required: false
        default: ubuntu-latest
      working-directory:
        description: Directory of the Cargo workspace, relative to the repository root.
        type: string
        required: false
        default: "."
      mise-install-args:
        description: >-
          Tools mise installs when `rust-version` is empty. Defaults to Rust only, so
          unrelated tools in the caller's mise.toml are not installed.
        type: string
        required: false
        default: rust
      clippy-args:
        description: Extra arguments for cargo clippy and cargo check, placed before `--`.
        type: string
        required: false
        default: ""
      locked:
        description: >-
          auto | true | false. Pass --locked (LOCKED_ARGS) to clippy, check, the doctests and
          the default test-command and build-command, so a stale Cargo.lock fails instead of
          being rewritten. auto: only when the workspace has a Cargo.lock. clippy-args that
          already hold --locked are not given a second one.
        type: string
        required: false
        default: auto
      tools:
        description: >-
          Comma-separated tools installed with taiki-e/install-action before the tests
          (e.g. "nextest"). Empty installs nothing.
        type: string
        required: false
        default: ""
      setup-command:
        description: >-
          Bash run in every matrix job after the toolchain is installed and before clippy,
          e.g. to install system packages. RUNNER_OS and TARGET are set.
        type: string
        required: false
        default: ""
      test-command:
        description: >-
          Bash that runs the tests on entries the runner can execute natively. Empty skips
          the tests. PACKAGE_ARGS, FEATURE_ARGS and LOCKED_ARGS are set. `--all-targets` does
          not run doctests; the `doc-tests` step does.
        type: string
        required: false
        default: cargo test $PACKAGE_ARGS --all-targets $FEATURE_ARGS $LOCKED_ARGS
      doc-tests:
        description: >-
          Also run `cargo test $PACKAGE_ARGS --doc $FEATURE_ARGS` where the tests run. A
          workspace without any library target is skipped with a notice.
        type: boolean
        required: false
        default: true
      build-command:
        description: >-
          Bash that builds a cross target the runner cannot execute. TARGET, PACKAGE_ARGS,
          FEATURE_ARGS and LOCKED_ARGS are set.
        type: string
        required: false
        default: >-
          cargo build $PACKAGE_ARGS --all-targets $FEATURE_ARGS $LOCKED_ARGS --target "$TARGET"
      package-args:
        description: >-
          Package selection for clippy, check, the tests and the MSRV check. Default
          --workspace covers every member, also when the root is a package. Use e.g.
          "-p mycrate", or "" for Cargo's default (the root package only).
        type: string
        required: false
        default: --workspace
      feature-args:
        description: >-
          Cargo feature flags for clippy, check and the MSRV check, e.g. "--all-features" or
          "--no-default-features --features cli".
        type: string
        required: false
        default: --all-features
      msrv:
        description: >-
          Minimum supported Rust version (e.g. "1.85"). Non-empty adds an `msrv` job that runs
          `msrv-command` with that toolchain on ubuntu-latest. Empty skips it.
        type: string
        required: false
        default: ""
      msrv-command:
        description: Bash run by the `msrv` job. PACKAGE_ARGS and FEATURE_ARGS are set.
        type: string
        required: false
        default: cargo check $PACKAGE_ARGS --all-targets $FEATURE_ARGS
      mise-auto-install:
        description: >-
          Let mise install the caller's other `mise.toml` tools on demand. false (default) sets
          MISE_AUTO_INSTALL=false in the `fmt` and `rust` jobs: only `mise-install-args` is
          installed by the mise step. Otherwise the first `rustup` or `cargo` call through a
          mise shim installs every tool of the caller's mise.toml (several minutes on Windows).
          Set true only when a command of the caller needs such a tool without installing it.
        type: boolean
        required: false
        default: false
      timeout-minutes:
        description: Timeout of each job.
        type: number
        required: false
        default: 60
      cache-all-refs:
        description: >-
          Save the Cargo cache on every ref, not only the default branch. For callers
          whose CI runs only on pull requests, so a re-run of a pull request is warm.
        type: boolean
        required: false
        default: false
      changed-only:
        description: >-
          Skip the work (not the check names) when the pull request or push changed no Rust
          file (sources, Cargo manifests, lock file, toolchain or Cargo config). Off by
          default: tests that read non-Rust files (docs, fixtures) would be skipped too.
        type: boolean
        required: false
        default: false
      skip:
        description: >-
          Skip the work (not the check names) whatever changed, e.g. on a docs-only pull
          request (`docs-only` from the config action). fmt and msrv report skipped, every
          matrix job reports success.
        type: boolean
        required: false
        default: false
      skip-runs-on:
        description: >-
          Runner label for every matrix entry when the jobs do no work (`skip`, or
          `changed-only` without a Rust change): their steps are no-ops, so no macOS
          (Xcode), Windows or ARM runner is started for them. The check names do not change.
          Empty keeps each entry's own `os`.
        type: string
        required: false
        default: ubuntu-latest
      full-package-args:
        description: >-
          Package selection used instead of `package-args` when a Cargo.toml or Cargo.lock
          changed (or the run has no diff), so a dependency change always covers every
          member. Empty keeps `package-args`.
        type: string
        required: false
        default: --workspace
      nextest-archive:
        description: >-
          Build `cargo nextest archive` once per matrix entry, after clippy and check and
          before the tests, and upload it as the artifact `nextest-archive-<target>`. The
          archive is built and run in the same job (same OS and target). The path is in
          `NEXTEST_ARCHIVE`: a `test-command` runs it with
          `cargo nextest run --archive-file "$NEXTEST_ARCHIVE" --workspace-remap .`. Needs
          nextest in `tools`. Only entries that run tests build it. false (default) changes
          nothing: `test-command` runs as before.
        type: boolean
        required: false
        default: false
      nextest-archive-args:
        description: >-
          Arguments of `cargo nextest archive`. Empty uses
          `$PACKAGE_ARGS --all-targets $FEATURE_ARGS $LOCKED_ARGS`.
        type: string
        required: false
        default: ""
      sccache:
        description: >-
          Use sccache with a Cloudflare R2 bucket as RUSTC_WRAPPER. Needs the secrets
          R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY and the variables (or inputs)
          SCCACHE_BUCKET and SCCACHE_ENDPOINT. When any is missing (fork pull request,
          Dependabot, bucket not created yet) the wrapper is cleared and the build runs
          without sccache; nothing fails. Pull requests only read the cache. false (default)
          changes nothing.
        type: boolean
        required: false
        default: false
      sccache-bucket:
        description: R2 bucket name. Empty uses the caller's variable SCCACHE_BUCKET.
        type: string
        required: false
        default: ""
      sccache-endpoint:
        description: >-
          https://<ACCOUNT_ID>.r2.cloudflarestorage.com. Empty uses the caller's variable
          SCCACHE_ENDPOINT.
        type: string
        required: false
        default: ""
    secrets:
      R2_ACCESS_KEY_ID:
        description: R2 API token Access Key ID for sccache (optional).
        required: false
      R2_SECRET_ACCESS_KEY:
        description: R2 API token Secret Access Key for sccache (optional).
        required: false

permissions:
  contents: read
  actions: write # cancel-run on failure

env:
  CARGO_TERM_COLOR: always
  PACKAGE_ARGS: ${{ inputs.package-args }}
  FEATURE_ARGS: ${{ inputs.feature-args }}
  SHARED_MATRIX: >-
    [
    {"os": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu"},
    {"os": "ubuntu-24.04-arm", "target": "aarch64-unknown-linux-gnu"},
    {"os": "xcode-27", "target": "aarch64-apple-darwin"},
    {"os": "windows-latest", "target": "x86_64-pc-windows-msvc"}
    ]

jobs:
  # The matrix input, or the shared matrix when it is empty (strategy cannot read `env`);
  # whether the jobs do any work (`run`) and which packages they cover (`package-args`).
  plan:
    # Draft pull requests (`skip-drafts`) skip `plan`, so every job below skips too.
    if: >-
      !inputs.skip-drafts
      || github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.runners.outputs.matrix }}
      run: ${{ steps.scope.outputs.run }}
      package-args: ${{ steps.scope.outputs.package-args }}
    steps:
      - id: m
        env:
          INPUT_MATRIX: ${{ inputs.matrix }}
        run: |
          set -euo pipefail
          m="${INPUT_MATRIX:-$SHARED_MATRIX}"
          echo "matrix=$(jq -c . <<<"$m")" >> "$GITHUB_OUTPUT"
      - id: changes
        uses: $/.github/actions/changes # nosemgrep: github-actions-mutable-action-tag
      # A dependency change (or no diff) widens the packages to `full-package-args` and
      # always runs; `changed-only` skips only when no Rust file changed at all.
      - id: scope
        env:
          CHANGED_ONLY: ${{ inputs.changed-only }}
          SKIP: ${{ inputs.skip }}
          FULL_PACKAGE_ARGS: ${{ inputs.full-package-args }}
          RUST: ${{ steps.changes.outputs.rust }}
          RUST_FULL: ${{ steps.changes.outputs.rust_full }}
        run: |
          set -euo pipefail
          run=true
          if [ "$CHANGED_ONLY" = true ] && [ "$RUST" != true ]; then run=false; fi
          if [ "$SKIP" = true ]; then run=false; fi
          packages="$PACKAGE_ARGS"
          if [ "$RUST_FULL" = true ] && [ -n "$FULL_PACKAGE_ARGS" ]; then
            packages="$FULL_PACKAGE_ARGS"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "package-args=$packages" >> "$GITHUB_OUTPUT"
          echo "work: $run; packages: ${packages:-<root package>}"
          if [ "$SKIP" = true ]; then
            echo "::notice title=ci-rust::skip is set; fmt, clippy, tests and MSRV are no-ops"
          elif [ "$run" = false ]; then
            echo "::notice title=ci-rust::no Rust file changed; fmt, clippy, tests and MSRV are no-ops"
          fi
      # No work: every entry keeps its name (`target`) but runs its no-op steps on
      # `skip-runs-on`, so a docs-only change queues no macOS, Windows or ARM runner.
      - id: runners
        env:
          MATRIX: ${{ steps.m.outputs.matrix }}
          RUN: ${{ steps.scope.outputs.run }}
          SKIP_RUNS_ON: ${{ inputs.skip-runs-on }}
        run: |
          set -euo pipefail
          m="$MATRIX"
          if [ "$RUN" != true ] && [ -n "$SKIP_RUNS_ON" ]; then
            m=$(jq -c --arg os "$SKIP_RUNS_ON" 'map(.os = $os)' <<<"$m")
            echo "::notice title=ci-rust::no work; every matrix entry runs on $SKIP_RUNS_ON"
          fi
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
      - name: Cancel the run on failure
        if: failure() && inputs.cancel-run-on-failure
        uses: $/.github/actions/cancel-run # nosemgrep: github-actions-mutable-action-tag

  fmt:
    name: fmt
    needs: plan
    # Static name, so a skipped `fmt` still reports as `fmt` (skipped counts as passed).
    if: needs.plan.outputs.run == 'true'
    runs-on: ${{ inputs.fmt-runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      MISE_AUTO_INSTALL: ${{ inputs.mise-auto-install }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: inputs.rust-version == ''
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          working_directory: ${{ inputs.working-directory }}
          install_args: ${{ inputs.mise-install-args }}

      - name: Use the pinned Rust
        env:
          RUST_VERSION: ${{ inputs.rust-version }}
        run: |
          set -euo pipefail
          if [ -n "$RUST_VERSION" ]; then
            version="$RUST_VERSION"
            rustup toolchain install "$version" --profile minimal --component rustfmt
          else
            version="$(mise current rust)"
            [ -n "$version" ] || { echo "mise.toml pins no rust version" >&2; exit 1; }
          fi
          echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"
          export RUSTUP_TOOLCHAIN="$version"
          rustup component add rustfmt
          rustc --version
          rustc --version | grep -q "^rustc $version " \
            || { echo "rustc is not the pinned Rust $version" >&2; exit 1; }

      - run: cargo fmt --all --check
      - name: Cancel the run on failure
        if: failure() && inputs.cancel-run-on-failure
        uses: $/.github/actions/cancel-run # nosemgrep: github-actions-mutable-action-tag

  rust:
    name: ${{ matrix.target }}
    needs: plan
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # Never skipped at job level: that happens before the matrix expands and reports a single
    # check under the raw expression name. With RUN=false every step is a no-op instead.
    env:
      TARGET: ${{ matrix.target }}
      RUN: ${{ needs.plan.outputs.run }}
      PACKAGE_ARGS: ${{ needs.plan.outputs.package-args }}
      MISE_AUTO_INSTALL: ${{ inputs.mise-auto-install }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pyrlyn Xcode, before anything compiles (cc, linker and SDK come from it).
      - name: Select Xcode ${{ inputs.xcode-version }}
        if: env.RUN == 'true' && runner.os == 'macOS' && inputs.xcode-version != ''
        uses: $/.github/actions/setup-xcode # nosemgrep: github-actions-mutable-action-tag
        with:
          version: ${{ inputs.xcode-version }}

      # Default path: the Rust version pinned in the caller's mise.toml.
      - if: env.RUN == 'true' && inputs.rust-version == ''
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          working_directory: ${{ inputs.working-directory }}
          install_args: ${{ inputs.mise-install-args }}

      # Make the pin the active toolchain for every later rustup/cargo call, add the
      # target, and fail if rustc is anything else (e.g. the runner image's own stable).
      # A target the runner cannot execute is a cross target: built, not tested.
      - if: env.RUN == 'true'
        name: Use the pinned Rust and add the target
        env:
          RUST_VERSION: ${{ inputs.rust-version }}
          # toJSON keeps JSON false as the string "false". A bare ${{ matrix.test }} can
          # arrive empty for boolean false, which would run the tests. A missing key is
          # null. Quotes are stripped so a JSON string "false" is accepted too.
          TEST: ${{ toJSON(matrix.test) }}
          LOCKED: ${{ inputs.locked }}
          CARGO_ARGS: ${{ inputs.clippy-args }}
        run: |
          set -euo pipefail
          if [ -n "$RUST_VERSION" ]; then
            version="$RUST_VERSION"
            rustup toolchain install "$version" --profile minimal --component clippy
          else
            version="$(mise current rust)"
            [ -n "$version" ] || { echo "mise.toml pins no rust version" >&2; exit 1; }
          fi
          echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"
          export RUSTUP_TOOLCHAIN="$version"
          # mise.toml may omit `components`; make sure clippy exists either way.
          rustup component add clippy
          rustup target add "$TARGET"
          rustc --version
          cargo --version
          rustc --version | grep -q "^rustc $version " \
            || { echo "rustc is not the pinned Rust $version" >&2; exit 1; }
          host="$(rustc -vV | sed -n 's/^host: //p')"
          test_flag=${TEST//'"'/}
          if [ "$host" = "$TARGET" ]; then
            echo "TARGET_ARGS=" >> "$GITHUB_ENV"
            if [ "$test_flag" = "false" ]; then native=false; else native=true; fi
          else
            echo "TARGET_ARGS=--target $TARGET" >> "$GITHUB_ENV"
            native=false
          fi
          echo "NATIVE=$native" >> "$GITHUB_ENV"
          echo "host $host, target $TARGET, tests run: $native"
          case "$LOCKED" in
            true) locked=--locked ;;
            false) locked="" ;;
            auto)
              manifest="$(cargo locate-project --workspace --message-format plain)"
              locked=""
              if [ -f "$(dirname "$manifest")/Cargo.lock" ]; then locked=--locked; fi
              ;;
            *) echo "::error::locked must be auto, true or false, got '$LOCKED'"; exit 1 ;;
          esac
          echo "LOCKED_ARGS=$locked" >> "$GITHUB_ENV"
          # clippy-args that already pass --locked (the pre-`locked` way) get no second one:
          # cargo rejects a repeated --locked.
          case " $CARGO_ARGS " in
            *" --locked "*) echo "CLIPPY_LOCKED_ARGS=" >> "$GITHUB_ENV" ;;
            *) echo "CLIPPY_LOCKED_ARGS=$locked" >> "$GITHUB_ENV" ;;
          esac
          echo "locked: ${locked:-no}"

      - if: env.RUN == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ inputs.working-directory }} -> target
          key: ${{ matrix.target }}
          save-if: >-
            ${{ inputs.cache-all-refs
            || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - if: env.RUN == 'true' && inputs.tools != ''
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: ${{ inputs.tools }}

      - name: sccache configuration
        id: sccache
        if: env.RUN == 'true' && inputs.sccache
        env:
          ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BUCKET: ${{ inputs.sccache-bucket || vars.SCCACHE_BUCKET }}
          ENDPOINT: ${{ inputs.sccache-endpoint || vars.SCCACHE_ENDPOINT }}
        run: |
          if [ -n "$ACCESS_KEY_ID" ] && [ -n "$SECRET_ACCESS_KEY" ] && [ -n "$BUCKET" ] \
            && [ -n "$ENDPOINT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            # mise.toml may export its own sccache as the wrapper; without a backend, drop it.
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
            echo "::notice title=sccache::off: the R2 secrets or variables are not available"
          fi

      - if: env.RUN == 'true' && inputs.sccache && steps.sccache.outputs.enabled == 'true'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: sccache environment
        if: env.RUN == 'true' && inputs.sccache && steps.sccache.outputs.enabled == 'true'
        env:
          ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BUCKET: ${{ inputs.sccache-bucket || vars.SCCACHE_BUCKET }}
          ENDPOINT: ${{ inputs.sccache-endpoint || vars.SCCACHE_ENDPOINT }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          {
            echo "RUSTC_WRAPPER=sccache"
            echo "CARGO_INCREMENTAL=0"
            echo "SCCACHE_BUCKET=$BUCKET"
            echo "SCCACHE_ENDPOINT=$ENDPOINT"
            echo "SCCACHE_REGION=auto"
            echo "AWS_ACCESS_KEY_ID=$ACCESS_KEY_ID"
            echo "AWS_SECRET_ACCESS_KEY=$SECRET_ACCESS_KEY"
            if [ "$EVENT_NAME" = pull_request ]; then echo "SCCACHE_S3_RW_MODE=READ_ONLY"; fi
          } >> "$GITHUB_ENV"

      - name: Setup
        if: env.RUN == 'true' && inputs.setup-command != ''
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }}
        run: eval "$SETUP_COMMAND"

      - if: env.RUN == 'true'
        name: clippy
        env:
          CARGO_ARGS: ${{ inputs.clippy-args }}
          FEATURE_ARGS: ${{ inputs.feature-args }}
        run: |
          # CARGO_ARGS and TARGET_ARGS are split on whitespace on purpose.
          # shellcheck disable=SC2086
          cargo clippy $PACKAGE_ARGS --all-targets $FEATURE_ARGS $TARGET_ARGS $CARGO_ARGS \
            $CLIPPY_LOCKED_ARGS -- -D warnings

      - if: env.RUN == 'true'
        name: check
        env:
          CARGO_ARGS: ${{ inputs.clippy-args }}
          FEATURE_ARGS: ${{ inputs.feature-args }}
        run: |
          # CARGO_ARGS and TARGET_ARGS are split on whitespace on purpose.
          # shellcheck disable=SC2086
          cargo check $PACKAGE_ARGS --all-targets $FEATURE_ARGS $TARGET_ARGS $CARGO_ARGS \
            $CLIPPY_LOCKED_ARGS

      - name: nextest archive
        if: >-
          env.RUN == 'true' && env.NATIVE == 'true' && inputs.test-command != ''
          && inputs.nextest-archive
        env:
          ARCHIVE_ARGS: ${{ inputs.nextest-archive-args }}
          FEATURE_ARGS: ${{ inputs.feature-args }}
        run: |
          set -euo pipefail
          command -v cargo-nextest >/dev/null \
            || { echo "::error::nextest-archive needs nextest in the tools input"; exit 1; }
          archive="$RUNNER_TEMP/nextest-archive-$TARGET.tar.zst"
          if [ -z "$ARCHIVE_ARGS" ]; then
            ARCHIVE_ARGS="$PACKAGE_ARGS --all-targets $FEATURE_ARGS $LOCKED_ARGS"
          fi
          # ARCHIVE_ARGS and TARGET_ARGS are split on whitespace on purpose.
          # shellcheck disable=SC2086
          cargo nextest archive $ARCHIVE_ARGS $TARGET_ARGS --archive-file "$archive"
          echo "NEXTEST_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: nextest archive artifact
        if: >-
          env.RUN == 'true' && env.NATIVE == 'true' && inputs.test-command != ''
          && inputs.nextest-archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextest-archive-${{ matrix.target }}
          path: ${{ env.NEXTEST_ARCHIVE }}
          retention-days: 1
          if-no-files-found: error

      - name: test
        if: env.RUN == 'true' && env.NATIVE == 'true' && inputs.test-command != ''
        env:
          FEATURE_ARGS: ${{ inputs.feature-args }}
          TEST_COMMAND: ${{ inputs.test-command }}
        run: eval "$TEST_COMMAND"

      - name: doctests
        if: env.RUN == 'true' && env.NATIVE == 'true' && inputs.test-command != '' && inputs.doc-tests
        run: |
          # The step shell runs with -e; keep going after a failure to inspect the log.
          set +e -uo pipefail
          log="$RUNNER_TEMP/doctests.log"
          # PACKAGE_ARGS, FEATURE_ARGS and LOCKED_ARGS are split on whitespace on purpose.
          # shellcheck disable=SC2086
          cargo test $PACKAGE_ARGS --doc $FEATURE_ARGS $LOCKED_ARGS 2>&1 | tee "$log"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ] && grep -q 'no library targets found' "$log"; then
            echo "::notice title=doctests skipped::no library target in the selected packages"
            exit 0
          fi
          exit "$code"

      - name: build (cross target, not run)
        if: env.RUN == 'true' && env.NATIVE != 'true' && inputs.build-command != ''
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
          FEATURE_ARGS: ${{ inputs.feature-args }}
        run: eval "$BUILD_COMMAND"
      - name: Cancel the run on failure
        if: failure() && inputs.cancel-run-on-failure
        uses: $/.github/actions/cancel-run # nosemgrep: github-actions-mutable-action-tag

  msrv:
    # Static: GitHub shows the raw expression in the name of a skipped job.
    name: msrv
    needs: plan
    if: inputs.msrv != '' && needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      PACKAGE_ARGS: ${{ needs.plan.outputs.package-args }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the MSRV toolchain
        env:
          MSRV: ${{ inputs.msrv }}
        run: |
          set -euo pipefail
          rustup toolchain install "$MSRV" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$MSRV" >> "$GITHUB_ENV"
          RUSTUP_TOOLCHAIN="$MSRV" rustc --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ inputs.working-directory }} -> target
          key: msrv-${{ inputs.msrv }}
          save-if: >-
            ${{ inputs.cache-all-refs
            || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: MSRV check
        env:
          FEATURE_ARGS: ${{ inputs.feature-args }}
          MSRV_COMMAND: ${{ inputs.msrv-command }}
        run: eval "$MSRV_COMMAND"
      - name: Cancel the run on failure
        if: failure() && inputs.cancel-run-on-failure
        uses: $/.github/actions/cancel-run # nosemgrep: github-actions-mutable-action-tag
