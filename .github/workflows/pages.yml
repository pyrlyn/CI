name: pages

# Build a static site and deploy it to GitHub Pages: replaces the Pages workflows of cox
# (deploy-pages.yml), ketch (pages.yml), rtok (docs.yml) and landing (pages.yml). The site
# generator is data: tools come from the caller's mise.toml (Hugo, Node, Go, just, ...) and
# `build-command` runs the build; `artifact-path` is uploaded and deployed.
# Pull requests build only; `deploy-ref` (default refs/heads/main) deploys.
#
# Caller job permissions: contents: read, pages: write, id-token: write. The caller owns the
# triggers and `concurrency` (e.g. group `pages`, cancel-in-progress: false).
on:
  workflow_call:
    inputs:
      skip-drafts:
        description: >-
          Skip every job on a draft pull request: a job-level `if`, so no runner starts. The
          caller's `pull_request` trigger must list `ready_for_review` in `types` so the run
          starts when the draft is marked ready. false runs drafts like any other pull request
          (ci.yml passes its `skip-drafts` config key).
        type: boolean
        required: false
        default: true
      build-command:
        description: Bash that builds the site (run in working-directory).
        type: string
        required: true
      artifact-path:
        description: Directory to upload as the Pages artifact (relative to the repository root).
        type: string
        required: true
      working-directory:
        description: Directory the setup and build commands run in.
        type: string
        required: false
        default: "."
      mise:
        description: Install tools from the caller's mise.toml.
        type: boolean
        required: false
        default: true
      mise-install-args:
        description: mise install arguments (empty = everything in mise.toml).
        type: string
        required: false
        default: ""
      node-version:
        description: Install Node via actions/setup-node instead of mise (empty = skip).
        type: string
        required: false
        default: ""
      node-cache-dependency-path:
        description: npm lockfile for setup-node's cache (with node-version).
        type: string
        required: false
        default: ""
      setup-command:
        description: Bash run before build-command (e.g. `npm ci`, installing Hugo).
        type: string
        required: false
        default: ""
      fetch-depth:
        description: Checkout depth (0 = full history, e.g. Hugo enableGitInfo).
        type: number
        required: false
        default: 1
      deploy-ref:
        description: Deploy only when github.ref equals this; other refs build only.
        type: string
        required: false
        default: refs/heads/main
      timeout-minutes:
        description: Build job timeout.
        type: number
        required: false
        default: 30
    outputs:
      page-url:
        description: URL of the deployed site (empty when not deployed).
        value: ${{ jobs.deploy.outputs.page-url }}

permissions:
  contents: read

jobs:
  build:
    # Draft pull requests (`skip-drafts`) skip `build`, and `deploy` with it.
    if: >-
      !inputs.skip-drafts
      || github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
          persist-credentials: false
      - if: inputs.mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install_args: ${{ inputs.mise-install-args }}
      - if: inputs.node-version != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.node-cache-dependency-path != '' && 'npm' || '' }}
          cache-dependency-path: ${{ inputs.node-cache-dependency-path }}
      - name: Setup
        if: inputs.setup-command != ''
        env:
          SETUP: ${{ inputs.setup-command }}
        run: bash -euo pipefail -c "$SETUP"
      - name: Build
        env:
          BUILD: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "$BUILD"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ inputs.artifact-path }}

  deploy:
    needs: build
    if: github.ref == inputs.deploy-ref && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    outputs:
      page-url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
