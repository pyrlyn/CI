name: self-test

# Runs ci-rust.yml against tests/fixtures/rust-crate through both toolchain paths: the
# default shared matrix with Rust from mise.toml, and a one-entry matrix with an exact
# rust-version (plus the MSRV job), and `skip` (the shared matrix with no work, every target
# on ubuntu-latest). `custom` is one more one-entry matrix (host target, "test": false) that
# overrides tools, setup-command, test-command, build-command, clippy-args and cache-all-refs.
# `pipeline` runs the gated pipeline (ci-rust, CodeQL,
# Semgrep, Snyk) on this repository. The extras run their safe paths: sonarcloud without a
# token (skips), dependabot-automerge on a non-Dependabot PR (every job skips),
# revert-on-failure as a dry run of this PR's commits, macos-sign without secrets (skips),
# setup-xcode (Xcode 27 on xcode-27, a missing version fails, a no-op on Linux), setup-rust
# (the fixture's pin, an extra target), the changes action (table test plus a live run,
# docs_only included), the config action's docs-only switch and the license/commits toggles
# (table test; the `ci` job runs it live, commits included), the commits action (table test),
# ci-dotnet.yml without a .NET project (no-op),
# failure-digest.sh against a fake gh, warnings-to-issues offline (fake gh and SonarCloud) and
# as a live dry run on this repository's code scanning alerts (reads only, writes nothing).
# A change to a reusable workflow or action is exercised before any caller pins it.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Only the newest run per workflow and ref executes: a new push cancels the older queued or
# in-progress run of this workflow on the same branch or PR. Not callable (no workflow_call),
# so github.workflow is this file's own name.
# A push to the default branch (a merge into main) never cancels or is superseded: it gets a
# group of its own run.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
    github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    && github.run_id || github.ref }}
  cancel-in-progress: >-
    ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

jobs:
  mise:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: mise.toml
    uses: ./.github/workflows/ci-rust.yml
    permissions:
      contents: read
      actions: write # cancel-run on failure
    with:
      working-directory: tests/fixtures/rust-crate

  rust-version:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: rust-version
    uses: ./.github/workflows/ci-rust.yml
    permissions:
      contents: read
      actions: write # cancel-run on failure
    with:
      rust-version: "1.98.1"
      msrv: "1.85"
      working-directory: tests/fixtures/rust-crate
      matrix: '[{"os": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu"}]'

  # Package selection override on the binary-only member: no library, so the doctest step
  # must skip with a notice instead of failing.
  no-lib:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: no-lib
    uses: ./.github/workflows/ci-rust.yml
    permissions:
      contents: read
      actions: write # cancel-run on failure
    with:
      rust-version: "1.98.1"
      package-args: -p ci-rust-fixture-cli
      working-directory: tests/fixtures/rust-crate
      matrix: '[{"os": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu"}]'

  # One host entry with "test": false, so the job builds instead of testing, and the
  # inputs the other jobs leave at their defaults: tools, setup-command, test-command,
  # build-command, clippy-args, cache-all-refs. setup must see nextest; the build checks
  # that marker. test-command fails the job if "test": false does not skip it.
  custom:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: custom
    uses: ./.github/workflows/ci-rust.yml
    permissions:
      contents: read
      actions: write # cancel-run on failure
    with:
      rust-version: "1.98.1"
      working-directory: tests/fixtures/rust-crate
      timeout-minutes: 30
      matrix: '[{"os": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu", "test": false}]'
      tools: nextest
      clippy-args: --quiet
      cache-all-refs: true
      setup-command: |
        command -v cargo-nextest >/dev/null
        echo ok > "$RUNNER_TEMP/ci-rust-custom-setup"
      test-command: |
        echo "test-command ran; the matrix entry set test to false" >&2
        exit 1
      build-command: |
        test -f "$RUNNER_TEMP/ci-rust-custom-setup"
        command -v cargo-nextest >/dev/null
        cargo nextest --version
        cargo build $PACKAGE_ARGS --all-targets $FEATURE_ARGS $LOCKED_ARGS --target "$TARGET"

  # `skip` over the shared four-target matrix: every target still reports under its name,
  # and all of them run their no-op steps on `skip-runs-on` (ubuntu-latest), so no macOS
  # (xcode-27), Windows or ARM runner is started.
  skip:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: skip
    uses: ./.github/workflows/ci-rust.yml
    permissions:
      contents: read
      actions: write # cancel-run on failure
    with:
      skip: true
      working-directory: tests/fixtures/rust-crate

  pipeline:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: pipeline
    uses: ./.github/workflows/pipeline.yml
    permissions:
      contents: read
      security-events: write
      actions: write
    with:
      rust: true
      rust-working-directory: tests/fixtures/rust-crate
      rust-matrix: '[{"os": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu"}]'
      rust-rust-version: "1.98.1"
      rust-mise-install-args: ""
      rust-clippy-args: --quiet
      rust-timeout-minutes: 30
      rust-cache-all-refs: true
      codeql-languages: '["actions"]'
      semgrep-extra-args: --exclude tests/fixtures
      snyk-args: --all-projects
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # lint.yml through workflow_call: its called-path concurrency group (never cancels).
  lint:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: lint
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read
      actions: write # cancel-run on failure

  # The config-driven entrypoint with tests/fixtures/infra.yml.
  ci:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: ci
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write
      pull-requests: read
      actions: write
    with:
      config-file: tests/fixtures/infra.yml

  # The setup-rust action with the fixture's mise.toml pin, an extra target and the cache.
  setup-rust:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: setup-rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: rust
        uses: ./.github/actions/setup-rust
        with:
          working-directory: tests/fixtures/rust-crate
          targets: wasm32-unknown-unknown
          cache: "true"
          cache-key: setup-rust
      - name: The pin is active, with the extra target
        working-directory: tests/fixtures/rust-crate
        env:
          VERSION: ${{ steps.rust.outputs.version }}
        run: |
          set -euo pipefail
          test "$VERSION" = 1.98.1
          test "$RUSTUP_TOOLCHAIN" = 1.98.1
          rustc --version | grep -q '^rustc 1\.98\.1 '
          rustup target list --installed | grep -qx wasm32-unknown-unknown
          cargo check --locked --workspace --target wasm32-unknown-unknown

  sonarcloud:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: sonarcloud
    uses: ./.github/workflows/sonarcloud.yml
    permissions:
      contents: read
      pull-requests: read
      actions: write
    with:
      rust: true
      project-base-dir: tests/fixtures/rust-crate
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  dependabot-automerge:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: dependabot-automerge
    uses: ./.github/workflows/dependabot-automerge.yml
    permissions:
      contents: write
      pull-requests: write
      actions: read
    with:
      ci-result: success
      wait-workflow: self-test.yml

  revert-on-failure:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: revert-on-failure (dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: revert
        uses: ./.github/actions/revert-on-failure
        with:
          before: ${{ github.event.pull_request.base.sha || github.event.before }}
          after: ${{ github.event.pull_request.head.sha || github.sha }}
          branch: ${{ github.head_ref || github.ref_name }}
          skip-workflow-changes: "false"
          dry-run: "true"
      - name: A revert commit was made
        env:
          REVERTED: ${{ steps.revert.outputs.reverted }}
        run: |
          echo "reverted=$REVERTED"
          [ "$REVERTED" = "true" ] || [ "$GITHUB_EVENT_NAME" != "pull_request" ]

  # The changes action: the offline table test, then a live run on this event.
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash tests/changes/test.sh
      # The config action's docs-only switch (normalize.py), offline.
      - run: bash tests/config/test.sh
      # The commits action's script on a scratch repository, offline.
      - run: bash tests/commits/test.sh
      # pin-sync's rewrite and template rendering on a scratch checkout, offline.
      - run: bash tests/pin-sync/test.sh
      - id: live
        uses: ./.github/actions/changes
      - name: Live outputs are booleans
        env:
          RUST: ${{ steps.live.outputs.rust }}
          SWIFT: ${{ steps.live.outputs.swift_full }}
          DOTNET_PRESENT: ${{ steps.live.outputs.dotnet_present }}
        run: |
          set -euo pipefail
          for v in "$RUST" "$SWIFT" "$DOTNET_PRESENT"; do
            [[ "$v" == true || "$v" == false ]] || { echo "not a boolean: '$v'"; exit 1; }
          done
          # This repository has no .NET project.
          [ "$DOTNET_PRESENT" = false ]

  # The daily failure digest and the shared issue script, offline against a fake gh.
  failure-digest:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: failure-digest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash tests/failure-digest/test.sh

  # warnings-to-issues: the script offline against a fake gh and a local fake SonarCloud.
  warnings-to-issues-test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: warnings-to-issues (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash tests/warnings-to-issues/test.sh

  # The reusable workflow live, as a dry run: reads this repository's alerts and warning
  # issues, prints the plan in the job summary, writes nothing.
  warnings-to-issues:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: warnings-to-issues (dry run)
    uses: ./.github/workflows/warnings-to-issues.yml
    permissions:
      contents: read
      issues: write
      security-events: read
    with:
      dry-run: true

  # No .NET project here: the job must run, do nothing and pass.
  dotnet:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: dotnet (no project)
    uses: ./.github/workflows/ci-dotnet.yml
    permissions:
      contents: read
      actions: write # cancel-run on failure

  macos-sign:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: macos-sign (no secrets)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-xcode
      - run: cp /bin/echo "$RUNNER_TEMP/echo-copy"
      - id: sign
        uses: ./.github/actions/macos-sign
        with:
          paths: ${{ runner.temp }}/echo-copy
      - name: Skipped without secrets
        env:
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: '[ "$SIGNED" = "false" ]'

  setup-xcode:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: setup-xcode (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [xcode-27, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: xcode
        uses: ./.github/actions/setup-xcode
      - name: Xcode 27 selected (macOS), nothing selected (Linux)
        env:
          XCODE_PATH: ${{ steps.xcode.outputs.path }}
          XCODE_VERSION: ${{ steps.xcode.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = macOS ]; then
            [[ "$XCODE_VERSION" == 27.* ]] || { echo "selected Xcode '$XCODE_VERSION'" >&2; exit 1; }
            [ "$(xcode-select -p)" = "$XCODE_PATH/Contents/Developer" ]
            # Captured first: `grep -q` exits on the first match, and xcodebuild aborts on the
            # broken pipe (SIGABRT, exit 134) under pipefail.
            version_out="$(xcodebuild -version)"
            grep -q '^Xcode 27\.' <<<"$version_out"
          else
            [ -z "$XCODE_PATH" ] && [ -z "$XCODE_VERSION" ]
          fi
      - id: missing
        if: runner.os == 'macOS'
        continue-on-error: true
        uses: ./.github/actions/setup-xcode
        with:
          version: "99"
      - name: A missing Xcode fails
        if: runner.os == 'macOS'
        env:
          OUTCOME: ${{ steps.missing.outcome }}
        run: '[ "$OUTCOME" = "failure" ]'
