name: lint

# Lints GitHub Actions workflows, composite actions and dependabot.yml with jactionlint
# (https://github.com/jdx/jactionlint; shellcheck runs inside it, the runner image ships
# shellcheck). The caller's `.github/jactionlint.yaml` picks the profile and the baseline
# (`baseline: auto` applies `.github/jactionlint-baseline.json`). Runs on this repository's own
# pull requests and on every push to main (a merge or a direct commit), and is reusable (`workflow_call`) so any repository can lint
# its workflows the same way. Callers pin a SHA; `push` here does not change `workflow_call`.
#
# Caller job permissions: contents: read, actions: write (cancel-run).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      skip-drafts:
        description: >-
          Skip every job on a draft pull request: a job-level `if`, so no runner starts. The
          caller's `pull_request` trigger must list `ready_for_review` in `types` so the run
          starts when the draft is marked ready. false runs drafts like any other pull request
          (ci.yml passes its `skip-drafts` config key).
        type: boolean
        required: false
        default: true
      cancel-run-on-failure:
        description: >-
          When a job fails, cancel the whole workflow run (every other running or queued
          job, the caller's included). The calling job must grant `actions: write`.
        type: boolean
        required: false
        default: true
      jactionlint-version:
        description: jactionlint version, installed through mise (github:jdx/jactionlint).
        type: string
        required: false
        default: 2.0.2
      args:
        description: Extra jactionlint arguments, e.g. "--ignore SC2086" (GNU-style options only).
        type: string
        required: false
        default: ""
      extra-command:
        description: Bash run after jactionlint (e.g. yamllint, typos, taplo). Empty skips.
        type: string
        required: false
        default: ""

# Run directly (this repository's pull_request / push / workflow_dispatch): only the newest
# run per ref executes, a new push cancels the older run, except on the default branch (a
# merge into main), where each run gets a group of its own. Called (workflow_call): the github context,
# github.workflow and github.workflow_ref included, is the caller's, so a shared group would
# let a newer caller run cancel this job inside an older caller run, e.g. two pushes to a
# consumer's main: the older run's gate then fails on a cancelled lint and revert-on-failure
# reverts a good commit. So a called lint gets a group of its own run and never cancels;
# cancelling older runs is the caller's workflow-level `concurrency` (docs/reusable-workflows.md).
concurrency:
  group: >-
    ${{ startsWith(github.workflow_ref,
    format('{0}/.github/workflows/lint.yml@', github.repository))
    && format('{0}-{1}', github.workflow,
    github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    && github.run_id || github.ref)
    || format('lint-call-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: >-
    ${{ startsWith(github.workflow_ref,
    format('{0}/.github/workflows/lint.yml@', github.repository))
    && github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read
  actions: write # cancel-run on failure

jobs:
  # The job keeps the id `actionlint`: this repository's ruleset requires a check of that name.
  actionlint:
    # `inputs.skip-drafts` is null outside workflow_call (this repository's own runs), and
    # null == false in expressions, hence toJSON: only an explicit false runs a draft.
    if: >-
      toJSON(inputs.skip-drafts) == 'false'
      || github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # install_args pins the tool without reading the caller's mise.toml. Outside
      # workflow_call the inputs are empty; the fallback matches this repository's mise.toml.
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install_args: github:jdx/jactionlint@${{ inputs.jactionlint-version || '2.0.2' }}
      - name: jactionlint
        env:
          VERSION: ${{ inputs.jactionlint-version || '2.0.2' }}
          ARGS: ${{ inputs.args }}
        # No files: jactionlint finds the workflows, actions and dependabot.yml itself. Files
        # a tool generated (cargo-dist's release.yml) get only the correctness and security
        # rules (`generated-files: skip-policy`, the default); the caller's
        # .github/jactionlint.yaml can set `generated-files: skip` or `report`.
        run: |
          set -euo pipefail
          # ARGS is split on whitespace on purpose.
          # shellcheck disable=SC2086
          mise exec "github:jdx/jactionlint@$VERSION" -- jactionlint --color $ARGS
      - name: Extra lint
        if: inputs.extra-command != ''
        env:
          EXTRA_COMMAND: ${{ inputs.extra-command }}
        run: eval "$EXTRA_COMMAND"
      - name: Cancel the run on failure
        if: failure() && inputs.cancel-run-on-failure
        uses: $/.github/actions/cancel-run # nosemgrep: github-actions-mutable-action-tag
