name: lint

# Lints GitHub Actions workflows with actionlint (shellcheck runs inside it; the runner image
# ships shellcheck). Runs on this repository's own pull requests and on every push to main
# (a merge or a direct commit), and is reusable (`workflow_call`) so any repository can lint
# its workflows the same way. Callers pin a SHA; `push` here does not change `workflow_call`.
#
# Caller job permissions: contents: read, actions: write (cancel-run).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      skip-drafts:
        description: >-
          Skip every job on a draft pull request: a job-level `if`, so no runner starts. The
          caller's `pull_request` trigger must list `ready_for_review` in `types` so the run
          starts when the draft is marked ready. false runs drafts like any other pull request
          (ci.yml passes its `skip-drafts` config key).
        type: boolean
        required: false
        default: true
      cancel-run-on-failure:
        description: >-
          When a job fails, cancel the whole workflow run (every other running or queued
          job, the caller's included). The calling job must grant `actions: write`.
        type: boolean
        required: false
        default: true
      actionlint-version:
        description: actionlint version, installed through mise.
        type: string
        required: false
        default: 1.7.12
      ignore-generated:
        description: >-
          Skip workflow files that cargo-dist generated (a "This file was autogenerated by
          dist" header, e.g. release.yml): their shell is dist's and every `dist init`
          rewrites them. false lints every file.
        type: boolean
        required: false
        default: true
      args:
        description: Extra actionlint arguments, e.g. "-ignore 'SC2086'".
        type: string
        required: false
        default: ""
      extra-command:
        description: Bash run after actionlint (e.g. yamllint, typos, taplo). Empty skips.
        type: string
        required: false
        default: ""

# Run directly (this repository's pull_request / push / workflow_dispatch): only the newest
# run per ref executes, a new push cancels the older run, except on the default branch (a
# merge into main), where each run gets a group of its own. Called (workflow_call): the github context,
# github.workflow and github.workflow_ref included, is the caller's, so a shared group would
# let a newer caller run cancel this job inside an older caller run, e.g. two pushes to a
# consumer's main: the older run's gate then fails on a cancelled lint and revert-on-failure
# reverts a good commit. So a called lint gets a group of its own run and never cancels;
# cancelling older runs is the caller's workflow-level `concurrency` (docs/reusable-workflows.md).
concurrency:
  group: >-
    ${{ startsWith(github.workflow_ref,
    format('{0}/.github/workflows/lint.yml@', github.repository))
    && format('{0}-{1}', github.workflow,
    github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    && github.run_id || github.ref)
    || format('lint-call-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: >-
    ${{ startsWith(github.workflow_ref,
    format('{0}/.github/workflows/lint.yml@', github.repository))
    && github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read
  actions: write # cancel-run on failure

jobs:
  actionlint:
    # `inputs.skip-drafts` is null outside workflow_call (this repository's own runs), and
    # null == false in expressions, hence toJSON: only an explicit false runs a draft.
    if: >-
      toJSON(inputs.skip-drafts) == 'false'
      || github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # install_args pins the tool without reading the caller's mise.toml. Outside
      # workflow_call the inputs are empty; the fallback matches this repository's mise.toml.
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install_args: actionlint@${{ inputs.actionlint-version || '1.7.12' }}
      - name: actionlint
        env:
          VERSION: ${{ inputs.actionlint-version || '1.7.12' }}
          ARGS: ${{ inputs.args }}
          # null outside workflow_call, like skip-drafts: only an explicit false lints all.
          IGNORE_GENERATED: ${{ toJSON(inputs.ignore-generated) != 'false' }}
        run: |
          set -euo pipefail
          files=()
          if [ "$IGNORE_GENERATED" = true ]; then
            shopt -s nullglob
            for f in .github/workflows/*.yml .github/workflows/*.yaml; do
              if head -n 5 "$f" | grep -q 'autogenerated by dist'; then
                echo "::notice file=$f::skipped: generated by cargo-dist"
              else
                files+=("$f")
              fi
            done
            # Nothing left to lint: every workflow is generated.
            if [ "${#files[@]}" -eq 0 ]; then exit 0; fi
          fi
          # ARGS is split on whitespace on purpose. No files: actionlint finds them itself.
          # shellcheck disable=SC2086
          mise exec "actionlint@$VERSION" -- actionlint -color $ARGS "${files[@]}"
      - name: Extra lint
        if: inputs.extra-command != ''
        env:
          EXTRA_COMMAND: ${{ inputs.extra-command }}
        run: eval "$EXTRA_COMMAND"
      - name: Cancel the run on failure
        if: failure() && inputs.cancel-run-on-failure
        uses: $/.github/actions/cancel-run # nosemgrep: github-actions-mutable-action-tag
