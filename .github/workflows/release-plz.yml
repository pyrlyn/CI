name: release-plz

# Reusable release-plz flow: on push to the default branch, open or refresh a release PR with
# release-plz (next version + changelog). Held back while the current version has no tag yet
# (a release in flight).
#
# It never releases: merging the release PR tags nothing, publishes nothing and dispatches
# nothing. bump.yml is the only path to a tag and a GitHub Release (the earlier `detect` /
# `verify` / `dispatch` jobs started the release build on a release PR merge and so released
# without bump; they are gone). Prefer bump.yml alone: a merged release PR leaves an untagged
# version on the default branch, which bump releases only with `release-untagged-head`.
# release-plz.toml must keep `git_tag_enable = false` and `git_release_enable = false`.
#
# RELEASE_PLZ_TOKEN (fine-grained PAT: contents + pull requests, write) is required: a PR
# opened with GITHUB_TOKEN starts no workflows, so it would be merged with no CI.
#
# Caller job permissions: contents: write, pull-requests: write, actions: write, issues: write
# (notify-failure: a failed run opens a `release-failure` issue).
on:
  workflow_call:
    inputs:
      cancel-run-on-failure:
        description: >-
          When a job fails, cancel the whole workflow run (every other running or queued
          job, the caller's included). The calling job must grant `actions: write`.
        type: boolean
        required: false
        default: true
      notify-maintainer:
        description: >-
          GitHub login mentioned and assigned on a `release-failure` issue when a job of this
          workflow fails (.github/actions/notify-release-failure). Empty turns it off. The
          calling job must grant `issues: write` either way.
        type: string
        required: false
        default: listepo
      tag-prefix:
        description: Tag prefix before the version, e.g. "v" or "my-crate-v".
        type: string
        required: false
        default: v
      package:
        description: >-
          Cargo package whose version names the release. Empty uses the first workspace
          package from `cargo metadata`.
        type: string
        required: false
        default: ""
      mise:
        description: Install tools from the caller's mise.toml (jdx/mise-action) in every job.
        type: boolean
        required: false
        default: true
    secrets:
      RELEASE_PLZ_TOKEN:
        description: "Fine-grained PAT (contents + pull requests: write). Not GITHUB_TOKEN: a PR opened with it runs no CI."
        required: true

permissions:
  contents: read
  actions: write # cancel-run on failure

# Never cancelled mid-run: release-plz pushes the release branch and edits the PR in steps.
# A newer run waits; GitHub keeps only the newest pending run per group (an older pending one is cancelled before it
# starts). The group is per repository, not github.workflow, which is the caller's name here.
concurrency:
  group: release-plz-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write # cancel-run on failure
    steps:
      - name: A token that gives the release PR its CI
        env:
          TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "RELEASE_PLZ_TOKEN is not set: a PR opened with GITHUB_TOKEN runs no CI." >&2
            echo "See https://release-plz.dev/docs/github/token" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags and history decide the next version
          persist-credentials: false
      - if: inputs.mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
      - name: Is a release still being published?
        id: pending
        env:
          PACKAGE: ${{ inputs.package }}
          PREFIX: ${{ inputs.tag-prefix }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r --arg p "$PACKAGE" \
            '[.packages[] | select($p == "" or .name == $p)][0].version')"
          tag="$PREFIX$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
          else
            echo "pending=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=release-plz::$tag is not released yet; release PR left alone"
          fi
      - if: steps.pending.outputs.pending == 'false'
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Cancel the run on failure
        if: failure() && inputs.cancel-run-on-failure
        uses: $/.github/actions/cancel-run # nosemgrep: github-actions-mutable-action-tag

  # A failed release on main (a tag on main counts) opens (or comments on) a `release-failure`
  # issue that mentions and assigns the maintainer; other branches and pull requests post
  # nothing (the notify-release-failure action checks the ref). always(): cancel-run cancels
  # the rest of the run after the first failure, and this job must run anyway.
  notify-failure:
    name: notify on failure
    needs: [release-pr]
    if: >-
      always() && inputs.notify-maintainer != ''
      && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # failed job names
      issues: write
    steps:
      - uses: $/.github/actions/notify-release-failure # nosemgrep: github-actions-mutable-action-tag
        with:
          ref: ${{ github.ref_name }}
          needs: ${{ toJSON(needs) }}
          maintainer: ${{ inputs.notify-maintainer }}
