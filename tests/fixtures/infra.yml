# self-test config for ci.yml: Rust CI on the fixture crate, CodeQL on workflows only,
# Semgrep/Snyk/SonarCloud/lint off (covered by other self-test jobs), two custom jobs.
version: 1
# Exercises the config action's docs-only path live: a pull request changing only Markdown
# skips the heavy checks below, as in a consumer; any other change (this file, a workflow)
# still runs everything.
docs-only:
  enabled: true
rust:
  enabled: true
  working-directory: tests/fixtures/rust-crate
  matrix:
    - {os: ubuntu-latest, target: x86_64-unknown-linux-gnu}
  rust-version: "1.98.1"
  mise-install-args: ""
  timeout-minutes: 30
  cache-all-refs: true
codeql:
  languages: [actions]
semgrep:
  enabled: false
snyk:
  enabled: false
lint:
  enabled: false
jobs:
  - name: echo
    mise: false
    runs-on: [ubuntu-latest, macos-latest]
    matrix:
      - {greeting: hello}
    run: test "$GREETING" = hello
  - name: fixture tree
    mise: false
    working-directory: tests/fixtures/rust-crate
    env: {EXPECT: Cargo.toml}
    run: test -f "$EXPECT"
