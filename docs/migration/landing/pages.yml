# .github/workflows/pages.yml — landing (Astro/Node). PRs build and check only.
name: pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pages:
    uses: pyrlyn/ci/.github/workflows/pages.yml@<SHA> # main
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      mise: false
      node-version: "22"
      node-cache-dependency-path: package-lock.json
      setup-command: npm ci
      build-command: |
        export SITE_URL=https://pyrlyn.github.io SITE_BASE=/landing/
        npm run build
        npm run check:docs
        npm run check:seo
      artifact-path: dist # upload-pages-artifact@v3 default path today is _site; confirm
