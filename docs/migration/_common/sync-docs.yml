# .github/workflows/sync-docs.yml — identical in cox, ketch, rtok.
name: sync-docs

on:
  push:
    branches: [main]
    paths: [docs/**, .github/workflows/sync-docs.yml]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: sync-docs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    uses: pyrlyn/ci/.github/workflows/sync-docs.yml@<SHA> # main
    permissions:
      contents: read
    # Internal pages beyond the shared list (research, qa, design, plans, runbooks, ...), one
    # rsync exclude pattern per line; omit when the shared list covers them.
    # with:
    #   extra-excludes: |
    #     compat.md
    #     i18n.md
    secrets:
      SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
