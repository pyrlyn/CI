# .github/workflows/pages.yml — ketch site (Hugo + Pagefind). The inline build/check steps move
# into site/build.sh (repository content, not workflow logic).
name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", "*.md", "package.json", "package-lock.json", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["site/**", "docs/**", "*.md", "package.json", "package-lock.json", ".github/workflows/pages.yml"]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pages:
    uses: pyrlyn/ci/.github/workflows/pages.yml@<SHA> # main
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      mise-install-args: node
      setup-command: HUGO_VERSION=0.165.0 bash site/install-hugo.sh
      build-command: BASE_URL=https://pyrlyn.github.io/ketch bash site/build.sh
      artifact-path: site/public
