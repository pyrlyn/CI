# .github/workflows/deploy-pages.yml — cox website (Hugo + Tailwind).
name: deploy-pages

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pages:
    uses: pyrlyn/ci/.github/workflows/pages.yml@<SHA> # main
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      mise: false # or pin hugo-extended/node in mise.toml and drop setup-command/node-version
      node-version: "22"
      node-cache-dependency-path: website/package-lock.json
      working-directory: website
      setup-command: |
        v=0.152.2
        curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v$v/hugo_extended_${v}_linux-amd64.tar.gz" | tar -xz hugo
        sudo install -m 755 hugo /usr/local/bin/hugo
        npm ci
      build-command: npm run build:css && hugo --minify --destination public
      artifact-path: website/public
