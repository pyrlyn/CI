# .github/workflows/docs.yml — rtok site (Hugo via mise + just).
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pages:
    uses: pyrlyn/ci/.github/workflows/pages.yml@<SHA> # main
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      fetch-depth: 0 # hugo enableGitInfo
      build-command: just site
      artifact-path: site/public
