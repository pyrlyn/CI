# .github/workflows/bump.yml — replaces bump.yml + verify.yml.
name: Bump and release

on:
  workflow_dispatch:
    inputs:
      level:
        description: which part of the version to raise, if the current one is already released
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: read

jobs:
  bump:
    uses: pyrlyn/ci/.github/workflows/bump.yml@<SHA> # main
    permissions:
      contents: write
      actions: write
    with:
      level: ${{ inputs.level }}
      release-script: tools/release.sh
      verify-command: just check && just example
