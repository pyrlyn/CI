[package]
name = "license-kit"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
publish = false
description = "Sync and check pyrlyn/ci's canonical license files in GPL repositories"

# Standalone: not a member of any other workspace in this repository.
[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
similar = "2"
toml = "0.8"

[profile.release]
codegen-units = 16
debug = false
