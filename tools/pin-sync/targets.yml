# pin-sync targets (tools/pin-sync/pin_sync.py, .github/workflows/pin-sync.yml). Each target gets
# one pull request from `branch` that moves every `pyrlyn/ci/<path>@<sha>` reference in `paths`
# to the synced commit (comment `# main`) and rewrites each `templates` entry: `dest` in the
# target from `template` in templates/ with `{{sha}}` and the entry's `vars` filled in. A file
# rendered from a template is replaced whole, so local edits to it are lost on the next sync;
# a repository that needs a different file drops the entry. Pull requests are never merged by
# the bot.
#
#   repo       owner/name
#   base       base branch (default main)
#   paths      globs of files whose pins move (default .github/**/*.yml and *.yaml)
#   exclude    globs left alone, e.g. a generated file whose generator checks it
#   templates  [{template, dest, vars}]
branch: ci/pin-sync
label: dependencies
templates: templates
title: "ci: pin pyrlyn/ci to {short}"
targets:
  - repo: pyrlyn/cox
    templates:
      - {template: dependabot.yml, dest: .github/workflows/dependabot.yml,
         vars: {wait-workflow: ci.yml}}
  - repo: pyrlyn/ketch
    # dist-generate.sh writes the notify-release-failure pin into the generated release.yml,
    # and CI fails when a regenerated release.yml differs from the committed one.
    paths: [".github/**/*.yml", ".github/**/*.yaml", scripts/dist-generate.sh]
    templates:
      - {template: dependabot.yml, dest: .github/workflows/dependabot.yml,
         vars: {wait-workflow: ci.yml}}
  - repo: pyrlyn/rtok
    templates:
      - {template: dependabot.yml, dest: .github/workflows/dependabot.yml,
         vars: {wait-workflow: pipeline.yml}}
  - repo: pyrlyn/runa
  - repo: pyrlyn/aulo
  - repo: pyrlyn/cla
  - repo: pyrlyn/landing
  # crates-packages: add once Actions are enabled there.
